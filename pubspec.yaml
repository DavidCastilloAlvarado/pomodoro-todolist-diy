name: birdle
description: "A Flutter todo app with SQL persistence, color palettes, alarms, and pomodoro timer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  drift: ^2.25.0
  drift_flutter: ^0.3.0
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^4.0.5
  workmanager: ^0.6.0
  flutter_foreground_task: ^8.13.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.20.2
  timezone: ^0.10.0
  flutter_timezone: ^5.0.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.25.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
